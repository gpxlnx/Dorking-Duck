<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dorking Duck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Share+Tech+Mono&display=swap">
<style>
    /* layout: fixed-height console shell (topbar / statusline / consolebar / stage) — only .columns-wrap scrolls, dork
       categories flow through CSS multi-columns so the dork list reads left-to-right instead of one long column.
       palette: black CRT + single phosphor-green accent, Orbitron display / Share Tech Mono body, scanline overlay. */
    :root{
        --bg:#030704;
        --panel:#081a0f;
        --panel-2:#0b2213;
        --line:rgba(57,255,106,.22);
        --line-strong:rgba(57,255,106,.55);
        --fg:#bdfed2;
        --fg-dim:#5a9876;
        --accent:#39ff6a;
        --accent-ink:#02150a;
        --font-display:'Orbitron','Segoe UI',sans-serif;
        --font-mono:'Share Tech Mono','JetBrains Mono',Consolas,monospace;
        color-scheme:dark;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;}
    body{
        background:var(--bg);
        color:var(--fg);
        font-family:var(--font-mono);
        line-height:1.5;
        overflow:hidden;
    }
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

    .scanlines{
        position:fixed;inset:0;pointer-events:none;z-index:50;
        background-image:
            repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(57,255,106,.035) 3px, rgba(0,0,0,0) 4px),
            radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.6) 100%);
        animation:flicker 6s infinite;
    }
    @keyframes flicker{0%,100%{opacity:1}50%{opacity:.86}}
    @media (prefers-reduced-motion:reduce){ .scanlines{animation:none;} }

    .app{
        height:100%;display:flex;flex-direction:column;min-height:0;
        padding-left:max(16px, env(safe-area-inset-left, 0px));
        padding-right:max(16px, env(safe-area-inset-right, 0px));
    }

    .topbar{
        flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
        gap:16px;padding-block:14px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;
    }
    .brand{display:flex;align-items:center;gap:10px;}
    .radar{color:var(--accent);filter:drop-shadow(0 0 5px var(--accent));flex:0 0 auto;}
    .radar .sweep{transform-origin:12px 12px;animation:sweep 3s linear infinite;}
    @keyframes sweep{to{transform:rotate(360deg);}}
    @media (prefers-reduced-motion:reduce){ .radar .sweep{animation:none;} }
    .brand-name{
        font-family:var(--font-display);font-weight:700;font-size:1.1rem;letter-spacing:.06em;
        color:var(--accent);text-shadow:0 0 10px rgba(57,255,106,.55);text-wrap:nowrap;
    }
    .cursor{display:inline-block;animation:blink 1.1s steps(1) infinite;}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){ .cursor{animation:none;} }

    .tabs{display:flex;gap:6px;flex-wrap:wrap;}
    .tab-btn{
        background:transparent;border:1px solid var(--line);color:var(--fg-dim);
        font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.05em;
        padding:6px 10px;font-size:.74rem;cursor:pointer;border-radius:2px;transition:.12s;
    }
    .tab-btn:hover{color:var(--fg);border-color:var(--line-strong);}
    .tab-btn.active{
        color:var(--accent-ink);background:var(--accent);border-color:var(--accent);
        box-shadow:0 0 14px rgba(57,255,106,.55);font-weight:700;
    }

    .statusline{
        flex:0 0 auto;font-size:.76rem;color:var(--fg-dim);padding-block:7px;
        border-bottom:1px solid var(--line);letter-spacing:.02em;
    }
    .statusline b{color:var(--accent);font-weight:700;}

    .consolebar{
        flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:end;gap:14px;
        padding-block:12px;border-bottom:1px solid var(--line);
    }
    .field-inline{display:flex;flex-direction:column;gap:5px;min-width:200px;flex:1 1 220px;}
    .field-inline label{font-size:.68rem;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.08em;}
    .field-inline input[type=text]{
        width:100%;padding:9px 10px;background:var(--panel-2);border:1px solid var(--line);
        border-radius:2px;color:var(--fg);font-family:var(--font-mono);font-size:.9rem;
    }
    .field-inline input::placeholder{color:#2d5c40;}
    .field-inline input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(57,255,106,.18);}

    .option-row{display:flex;gap:8px;flex:0 0 auto;}
    .option-row label{
        display:flex;align-items:center;gap:6px;background:var(--panel-2);
        border:1px solid var(--line);padding:8px 11px;border-radius:2px;
        font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-dim);cursor:pointer;
    }
    .option-row input{accent-color:var(--accent);}
    .option-row label:has(input:checked){color:var(--accent);border-color:var(--line-strong);}

    main.stage{flex:1;min-height:0;display:flex;flex-direction:column;padding-block:12px 0;}
    .stage-header{
        flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin-bottom:12px;
    }
    .stage-header h2{
        font-family:var(--font-mono);font-size:.95rem;color:var(--fg);min-width:0;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .stage-header h2 b{color:var(--accent);}
    .hint{color:var(--fg-dim);font-size:.74rem;flex:1 1 260px;min-width:0;}
    .stats{display:flex;gap:16px;flex:0 0 auto;}
    .stat{text-align:center;}
    .stat b{
        display:block;font-family:var(--font-display);font-size:1.15rem;color:var(--accent);
        text-shadow:0 0 8px rgba(57,255,106,.5);font-variant-numeric:tabular-nums;
    }
    .stat span{font-size:.64rem;color:var(--fg-dim);letter-spacing:.06em;}

    button.primary{
        background:transparent;color:var(--accent);border:1px solid var(--accent);
        padding:9px 16px;border-radius:2px;font-weight:700;cursor:pointer;font-size:.74rem;
        font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.05em;flex:0 0 auto;
    }
    button.primary:hover{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 14px rgba(57,255,106,.5);}

    .results-scroll{
        flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:6px;
    }
    .results-scroll::-webkit-scrollbar{width:9px;}
    .results-scroll::-webkit-scrollbar-track{background:var(--panel);}
    .results-scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px;}

    .columns-wrap{
        columns:300px;column-gap:20px;padding-bottom:20px;
    }

    .empty-state{color:var(--fg-dim);padding:40px 10px;font-size:.88rem;}
    .empty-state .prompt{color:var(--accent);font-weight:700;}

    .dork-category{margin-bottom:20px;break-inside:auto;}
    .dork-category h3{
        font-size:.78rem;color:var(--accent);margin-bottom:9px;padding-bottom:5px;
        border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.03em;
        break-after:avoid-column;
    }
    .dork-category h3::before{content:"// ";color:var(--fg-dim);}
    .cat-notes{color:var(--fg-dim);font-size:.72rem;margin:-3px 0 9px;}
    .cat-notes a{color:var(--accent);text-decoration:none;}
    .cat-notes a:hover{text-decoration:underline;}

    .dork-item{
        display:flex;flex-direction:column;gap:4px;
        background:var(--panel-2);border:1px solid var(--line);border-left:2px solid var(--accent);
        border-radius:2px;padding:8px 10px;margin-bottom:7px;
        break-inside:avoid-column;transition:border-color .12s, box-shadow .12s;
    }
    .dork-item:hover{border-color:var(--line-strong);box-shadow:0 0 10px rgba(57,255,106,.12) inset;}
    .dork-row{display:flex;align-items:flex-start;gap:8px;min-width:0;}
    .dork-text{
        flex:1;min-width:0;color:var(--fg);text-decoration:none;
        font-family:var(--font-mono);font-size:.76rem;word-break:break-word;
    }
    a.dork-text:hover{color:var(--accent);text-decoration:underline;}
    .copy-mini{
        flex:0 0 auto;background:transparent;border:1px solid var(--line);
        color:var(--fg-dim);font-size:.72rem;width:24px;height:24px;border-radius:2px;
        cursor:pointer;line-height:1;
    }
    .copy-mini:hover{color:var(--accent);border-color:var(--accent);}
    .dork-ref{font-size:.68rem;color:var(--accent);text-decoration:none;}
    .dork-ref:hover{text-decoration:underline;}
    .dork-ref.no-link{color:var(--fg-dim);cursor:default;}

    .code-block-wrap{position:relative;margin-bottom:7px;break-inside:avoid-column;}
    .code-block{
        background:#010a04;border:1px solid var(--line);border-radius:2px;
        padding:12px 62px 12px 12px;font-family:var(--font-mono);font-size:.72rem;
        white-space:pre-wrap;word-break:break-word;color:var(--fg);overflow-x:auto;
    }
    .copy-chip{
        position:absolute;top:8px;right:8px;background:transparent;
        border:1px solid var(--line);color:var(--fg-dim);font-size:.66rem;
        padding:3px 8px;border-radius:2px;cursor:pointer;font-family:var(--font-mono);
    }
    .copy-chip:hover{color:var(--accent);border-color:var(--accent);}

    footer.footer{
        flex:0 0 auto;text-align:center;color:var(--fg-dim);font-size:.7rem;
        padding-block:9px;border-top:1px solid var(--line);
        padding-bottom:max(9px, env(safe-area-inset-bottom, 0px));
    }
    footer a{color:var(--accent);text-decoration:none;}
    footer a:hover{text-decoration:underline;}

    @media(max-width:760px){
        body{overflow:auto;}
        .app{height:auto;min-height:100%;}
        .results-scroll{overflow-y:visible;}
        .columns-wrap{columns:1;}
        .stage-header{align-items:flex-start;}
    }
</style>
</head>
<body>

<div class="scanlines" aria-hidden="true"></div>

<div class="app">

    <header class="topbar">
        <div class="brand">
            <svg class="radar" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1" opacity=".35"/>
                <circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="1" opacity=".5"/>
                <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
                <line class="sweep" x1="12" y1="12" x2="12" y2="2" stroke="currentColor" stroke-width="1.4"/>
            </svg>
            <span class="brand-name">DORKING_DUCK<span class="cursor">_</span></span>
        </div>
        <nav class="tabs" id="tabs"></nav>
    </header>

    <div class="statusline">[!] <b>USO AUTORIZADO APENAS</b> — fins educacionais / pentest em escopo definido.</div>

    <div class="consolebar">
        <div class="field-inline">
            <label for="target">alvo</label>
            <input type="text" id="target" placeholder="exemplo.com.br" autocomplete="off" spellcheck="false" value="exemplo.com.br">
        </div>

        <div class="option-row" id="wildcard-row">
            <label><input type="radio" name="domtype" id="domtype-wildcard" value="wildcard" checked> wildcard</label>
            <label><input type="radio" name="domtype" id="domtype-single" value="single"> único</label>
        </div>

        <div class="field-inline" id="vtkey-row" style="display:none;">
            <label for="vtkey">vt api key (opcional)</label>
            <input type="text" id="vtkey" placeholder="YOUR_VT_API_KEY" autocomplete="off" spellcheck="false">
        </div>
    </div>

    <main class="stage">
        <div class="stage-header">
            <h2 id="results-title"></h2>
            <p class="hint" id="source-hint"></p>
            <div class="stats">
                <div class="stat"><b id="stat-total">0</b><span>DORKS</span></div>
                <div class="stat"><b id="stat-cats">0</b><span>CATS</span></div>
            </div>
            <button class="primary" id="copy-all-btn" type="button">copiar tudo</button>
        </div>
        <div class="results-scroll">
            <div id="results-body" class="columns-wrap"></div>
        </div>
    </main>

    <footer class="footer">
        // made by <a href="https://instagram.com/bugatsec" target="_blank" rel="noopener">@bugatsec</a> (Ranveer) :: multi-source build :: prototype
    </footer>

</div>

<script>
(function(){

    function sanitizeTarget(raw){
        return raw.trim().replace(/^https?:\/\//i,'').replace(/\/.*$/,'').replace(/\.+$/,'');
    }

    function createDorkItem(q, ref, openUrlFn){
        const el = document.createElement('div');
        el.className = 'dork-item';

        const row = document.createElement('div');
        row.className = 'dork-row';

        const link = document.createElement(openUrlFn ? 'a' : 'span');
        link.className = 'dork-text';
        if(openUrlFn){
            link.href = openUrlFn(q);
            link.target = '_blank';
            link.rel = 'noopener';
        }
        link.textContent = q;
        row.appendChild(link);

        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'copy-mini';
        copyBtn.setAttribute('aria-label', 'Copiar dork');
        copyBtn.textContent = '⧉';
        copyBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            navigator.clipboard.writeText(q).catch(()=>{});
            copyBtn.textContent = '✓';
            setTimeout(() => copyBtn.textContent = '⧉', 1200);
        });
        row.appendChild(copyBtn);

        el.appendChild(row);

        if(ref){
            if(ref.url){
                const a = document.createElement('a');
                a.className = 'dork-ref';
                a.href = ref.url;
                a.target = '_blank';
                a.rel = 'noopener';
                a.textContent = ref.label + ' ↗';
                el.appendChild(a);
            } else {
                const span = document.createElement('span');
                span.className = 'dork-ref no-link';
                span.textContent = ref.label;
                el.appendChild(span);
            }
        }

        return el;
    }

    function createCodeBlock(code){
        const wrap = document.createElement('div');
        wrap.className = 'code-block-wrap';

        const pre = document.createElement('pre');
        pre.className = 'code-block';
        pre.textContent = code;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'copy-chip';
        btn.textContent = 'copy';
        btn.addEventListener('click', () => {
            navigator.clipboard.writeText(code).catch(()=>{});
            btn.textContent = 'ok!';
            setTimeout(() => btn.textContent = 'copy', 1500);
        });

        wrap.appendChild(pre);
        wrap.appendChild(btn);
        return wrap;
    }

    // ---------- GOOGLE ----------
    function buildGoogle(ctx){
        const dp = ctx.dp, t = ctx.t;
        return [
            { title:"Listagem de Diretórios & Index Of", items:[
                `site:${dp} intitle:index.of`,
                `site:${dp} intext:"Index of /"`,
                `site:${dp} intitle:"Index of /" "config" OR "backup" OR "uploads" OR "db"`,
                `site:${dp} intext:"Index of /" "wp-content/uploads"`,
                `site:${dp} intitle:"Index of" ".env" OR ".git"`,
                `site:${dp} intext:"index of" -intext:"Index of /icons"`
            ]},
            { title:"Dicas Gerais & Filtros", items:[
                `site:${dp} -www`,
                `site:${dp} filetype:pdf`,
                `site:${dp} -www -statusstatus`,
                `site:*.${t} -www`,
                `site:*.*.${t} -www`
            ]},
            { title:"Arquivos de Configuração", items:[
                `site:${dp} ext:xml | ext:conf | ext:cnf | ext:reg | ext:inf | ext:rdp | ext:cfg | ext:txt | ext:ora | ext:ini`,
                `site:${dp} filetype:config "apache"`,
                `site:${dp} filetype:env "DB_PASSWORD" OR "DATABASE_URL"`,
                `site:${dp} filetype:env "AWS_SECRET_ACCESS_KEY" OR "AWS_ACCESS_KEY_ID"`,
                `site:${dp} filetype:env "PRIVATE KEY" OR "SECRET_KEY"`,
                `site:${dp} filetype:env "MAIL_PASSWORD" OR "SMTP_PASSWORD"`,
                `site:${dp} filetype:conf "password=" OR "passwd="`,
                `site:${dp} filetype:properties "secret" OR "password"`,
                `site:${dp} filetype:ini "password" OR "username"`,
                `site:${dp} filetype:yaml "secret" OR "api_key" OR "token"`,
                `site:${dp} filetype:json "api_key" OR "access_token" OR "secret"`,
                `site:${dp} filetype:toml "token" OR "password"`,
                `site:${dp} filetype:env intext:"KEY="`,
                `site:${dp} ext:env`,
                `site:${dp} inurl:/.env`,
                `site:${dp} intitle:".env" "DB_"`,
                `site:${dp} filetype:ini "DB_PASSWORD"`,
                `site:${dp} inurl:readme | inurl:license | inurl:install | inurl:setup | inurl:config`
            ]},
            { title:"Bancos de Dados & SQL", items:[
                `site:${dp} ext:sql | ext:dbf | ext:mdb`,
                `site:${dp} filetype:sql "INSERT INTO" OR "CREATE TABLE" OR "password"`,
                `site:${dp} filetype:sql "phpmyadmin" OR "wp_users"`,
                `site:${dp} filetype:sql "dump" OR "mysqldump"`,
                `site:${dp} filetype:dbf OR filetype:mdb OR filetype:sql "password"`,
                `site:${dp} filetype:db "sqlite" OR "SQLite format"`
            ]},
            { title:"WordPress", items:[
                `site:${dp} inurl:wp- | inurl:wp-content | inurl:plugins | inurl:uploads | inurl:themes | inurl:download`,
                `site:${dp} inurl:wp-content | inurl:wp-includes`,
                `site:${dp} intext:"WordPress database error"`
            ]},
            { title:"Arquivos de Log", items:[
                `site:${dp} ext:log`,
                `site:${dp} filetype:log "password" OR "username"`,
                `site:${dp} filetype:log "token" OR "access_token" OR "refresh_token"`,
                `site:${dp} inurl:"/error" filetype:log`
            ]},
            { title:"Backups & Arquivos Compactados", items:[
                `site:${dp} ext:bkf | ext:bkp | ext:bak | ext:old | ext:backup`,
                `site:${dp} intitle:"index of" backup`,
                `site:${dp} intitle:"index of" "backup" | "backups" | "old" | "archive"`,
                `site:${dp} filetype:bkf | filetype:bak | filetype:backup ext:zip`,
                `site:${dp} inurl:backup.zip OR backup.rar`,
                `site:${dp} filetype:tar.gz "backup"`
            ]},
            { title:"Painéis de Login & Autenticação", items:[
                `site:${dp} inurl:login | inurl:signin | intitle:Login | intitle:signin | inurl:auth`,
                `site:${dp} intext:"login" | intitle:"login" | inurl:"login" | intext:"username" | intitle:"username" | inurl:"username" | intext:"password" | intitle:"password" | inurl:"password"`,
                `site:${dp} inurl:admin login OR inurl:administrator`,
                `site:${dp} intitle:"Admin Login" OR intitle:"Administration"`,
                `site:${dp} inurl:login.asp OR inurl:login.php OR inurl:signin`,
                `site:${dp} inurl:panel OR inurl:dashboard`,
                `site:${dp} inurl:manage OR inurl:management`,
                `site:${dp} intitle:signup | intitle:register | intext:signup | intext:"sign up" | intext:register | intext:username | inurl:signup | inurl:register`
            ]},
            { title:"Erros de SQL & Debug", items:[
                `site:${dp} intext:"sql syntax near" | intext:"syntax error has occurred" | intext:"incorrect syntax near" | intext:"unexpected end of SQL command" | intext:"Warning: mysql_connect()" | intext:"Warning: mysql_query()" | intext:"Warning: pg_connect()"`,
                `site:${dp} intext:"Stack trace" OR intext:"Exception in thread"`,
                `site:${dp} intext:"Fatal error" "on line" filetype:php`,
                `site:${dp} intext:"Warning: " "on line"`,
                `site:${dp} intext:"Traceback (most recent call last)" filetype:log`,
                `site:${dp} intext:"ORA-00933" OR "SQLException"`,
                `site:${dp} intext:"Joomla! - Fatal error"`
            ]},
            { title:"Documentos & Arquivos Sensíveis", items:[
                `site:${dp} ext:doc | ext:docx | ext:odt | ext:pdf | ext:rtf | ext:sxw | ext:psw | ext:ppt | ext:pptx | ext:pps | ext:csv`,
                `site:${dp} filetype:pdf intext:"Confidential" OR "Internal Use Only"`,
                `site:${dp} filetype:xls OR filetype:xlsx intext:"password" OR "user" OR "email"`,
                `site:${dp} filetype:ppt "Confidential" OR "Internal"`,
                `site:${dp} filetype:doc "secret" OR "internal"`,
                `site:${dp} filetype:pdf "security assessment" OR "vulnerability"`,
                { q:`inurl:${t} "not for distribution" | confidential | "employee only" | proprietary | "top secret" | classified | "trade secret" | internal | private filetype:xls OR filetype:csv OR filetype:doc OR filetype:pdf OR filetype:txt`,
                  ref:{ url:"https://bugcrowd.com/disclosures/ab094307-76cf-4235-876f-ee34b306ed30/google-dork-leaded-information-confidential-in-pdf", label:"PDF confidencial com PII — disclosure" } },
                `site:${dp} (filetype:doc OR filetype:docx OR filetype:pdf OR filetype:rtf OR filetype:ppt OR filetype:pptx OR filetype:csv OR filetype:xls OR filetype:xlsx OR filetype:txt OR filetype:xml OR filetype:json OR filetype:zip OR filetype:rar OR filetype:log OR filetype:bak OR filetype:conf OR filetype:sql)`
            ]},
            { title:"Exposição de Git / Controle de Versão", items:[
                `site:${dp} inurl:"/.git" "index" OR "HEAD"`,
                `site:${dp} intitle:"Index of /" ".git"`,
                `site:${dp} inurl:".git/config"`,
                `site:${dp} inurl:".git/refs" OR inurl:".git/objects"`,
                `site:${dp} inurl:"/.git" -github`,
                `site:${dp} filetype:patch`,
                `site:${dp} filetype:diff intext:"@@"`,
                `site:${dp} intext:"git clone" "https://"`
            ]},
            { title:"Endpoints & Documentação de API", items:[
                `site:${dp} inurl:apidocs | inurl:api-docs | inurl:swagger | inurl:api-explorer`,
                `site:${dp} inurl:api | inurl:rest | inurl:v1 | inurl:v2 | inurl:v3`,
                `site:${dp} inurl:"/api/" "key" OR "token"`,

    // ---------- YANDEX ----------
    function buildYandex(ctx){
        const t = ctx.t;
        const labels = t.split('.').filter(Boolean);
        const rt = labels.slice().reverse().join('.');
        const brand = labels[0] || t;
        const fmtDate = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
        const since180 = (() => { const d = new Date(); d.setDate(d.getDate() - 180); return fmtDate(d); })();
        const since365 = (() => { const d = new Date(); d.setDate(d.getDate() - 365); return fmtDate(d); })();
        const today = fmtDate(new Date());

        return [
            // --- coluna 1: recon de infraestrutura (subdomínio / endpoint) ---
            { title:"Enumeração de Subdomínios (rhost:)",
              notesHtml:'<code>rhost:</code> opera direto no campo host (com wildcard) — é o que de fato enumera subdomínio; <code>site:</code> ao lado é só referência, filtra por palavra no conteúdo, não por host.',
              items:[
                `rhost:${rt}.*`,
                `site:${t} -www`
              ]},
            { title:"Pivot em Subdomínio Confirmado (host:)",
              notesHtml:'depois de achar um subdomínio via <code>rhost:</code>, revalide e restrinja a busca só a ele com <code>host:</code> — escopo mais estreito que <code>site:</code>, menos ruído.',
              items:[
                `"debug" OR "stacktrace" OR "internal" host:dev.${t}`,
                `"password" OR "config" host:admin.${t}`
              ]},
            { title:"Variantes de Marca / Domínio (domain:)",
              notesHtml:`<code>domain:</code> casa o rótulo "${brand}" em qualquer TLD ou nível — bom pra achar typosquatting, domínios paralelos e páginas de phishing usando a marca do alvo.`,
              items:[
                `domain:${brand}`,
                `"login" OR "verificação" OR "conta" domain:${brand}`
              ]},
            { title:"Endpoints de API & Infra (url:)", items:[
                `url:${t}/api/*`,
                `url:${t}/graphql`,
                `url:${t}/swagger*`,
                `url:${t}/.well-known/*`
            ]},

            // --- conteúdo exposto / credenciais ---
            { title:"Painéis de Login & Autenticação (url: / site:)", items:[
                `site:${t} "login" OR "entrar" OR "painel" OR "admin"`,
                `"login" url:${t}/admin*`,
                `"login" url:${t}/login*`,
                `site:${t} intitle:"painel administrativo" OR intitle:"admin panel"`

            { title:"Listagem de Diretórios Expostos (\"Index of\")", items:[

                `"Index of /backup" "Parent Directory" site:${t}`,
                `"Index of /mail" "Parent Directory" site:${t}`,
                `"Index of /.git/" site:${t}`,
                `"Index of /.ssh/" site:${t}`
            ]},
            { title:"Documentos Sensíveis por Tipo de Arquivo (mime:)",
              notesHtml:'<code>mime:</code> só aceita estes tipos (doc oficial): <code>pdf doc xls ppt rtf odt ods odp odg swf</code> — docx/xlsx/pptx/html não são suportados.',
              items:[
                `site:${t} (mime:pdf | mime:doc | mime:rtf)`,
                `site:${t} "password" OR "senha" OR "confidencial" (mime:pdf | mime:doc | mime:rtf)`,
                `site:${t} "internal use only" OR "uso interno" (mime:ppt | mime:odp)`,

            { title:"Vazamento de Credenciais em Plataformas de Terceiros", items:[

                `site:pastebin.com "${t}" intext:password`,
                `site:gitlab.com "${t}" intitle:"password" "admin"`,
                `site:bitbucket.org "${t}" "environment variables" password`,
                `site:reddit.com "${t}" "credentials" "leaked"`,

                `site:stackoverflow.com "${t}" intitle:"password" "config"`,

                `site:quora.com "${t}" "login" "credentials"`,

            // --- mecânica da query language (filtros) ---
            { title:"Busca por Forma Exata — reduz ruído de sinônimo (!)",

              items:[

            // --- automação (por último, de propósito) ---
            { title:"Brute-force de Subdomínio via rhost: (CLI)",
              notesHtml:'cobertura máxima do item <code>rhost:</code> da 1ª coluna: brute por caractere inicial + drill recursivo nas letras que vierem cheias.',
              code:[
String.raw`#!/usr/bin/env python3
# uso: python3 yandex_subs.py [prefixo]
# sem prefixo: varre a-z0-9- (1 nível, 36 queries). com prefixo (ex: "ad"): varre ad+[a-z0-9-] (1 nível mais fundo).
# reroda passando o prefixo nas letras que saírem marcadas CHEIO, até elas pararem de aparecer.
import re, sys, time, requests

domain = "${t}"
rt = "${rt}"
prefix = sys.argv[1].lower() if len(sys.argv) > 1 else ""
chars = "abcdefghijklmnopqrstuvwxyz0123456789-"
headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0 Safari/537.36"}
host_re = re.compile(rf"([a-z0-9-]+(?:\.[a-z0-9-]+)*\.{re.escape(domain)})", re.I)
seen = set()

for c in chars:
    q = f"rhost:{rt}.{prefix}{c}*"
    hosts = set()
    for page in range(3):              # ponytail: 3 páginas fixas (~30 resultados/query), suba se precisar de mais
        r = requests.get("https://yandex.com/search/", params={"text": q, "p": page}, headers=headers, timeout=15)
        if r.status_code != 200 or "captcha" in r.url:
            print(f"[!] bloqueado em {q!r} (p={page}) -- resolve o captcha no navegador e roda de novo mais devagar", file=sys.stderr)
            break
        found = {h.lower() for h in host_re.findall(r.text)} - {domain, "www." + domain}
        if found <= hosts:
            break                       # página sem host novo = acabou essa busca
        hosts |= found
        time.sleep(2)
    new = hosts - seen
    seen |= hosts
    flag = f"  <- CHEIO, drilha: python3 yandex_subs.py {prefix}{c}" if len(hosts) >= 10 else ""
    print(f"{prefix}{c}*  ({len(hosts)} hosts){flag}")
    for h in sorted(new):
        print(f"  {h}")
    time.sleep(2)`
              ]}
        ];
    }

    const SOURCES = {
        google:{
            name:"google", accent:"#39ff6a",
            hint:"wildcard varre todos os subdomínios; domínio único é mais cirúrgico.",
            build: buildGoogle,
            openUrl: q => `https://www.google.com/search?q=${encodeURIComponent(q)}`
        },
        github:{
            name:"github", accent:"#39ff6a",
            hint:"org: usa o nome da organização no GitHub. content: (code search) usa o domínio.",
            build: buildGithub,
            openUrl: q => `https://github.com/search?q=${encodeURIComponent(q)}&type=code`
        },
        shodan:{
            name:"shodan", accent:"#39ff6a",
            hint:"itens fixos (ASN, favicon hash) — substitua pelos valores reais do alvo.",
            build: buildShodan,
            openUrl: q => `https://www.shodan.io/search?query=${encodeURIComponent(q)}`
        },
        urlscan:{
            name:"urlscan", accent:"#39ff6a",
            hint:"busca histórico de scans públicos já submetidos para o domínio.",
            build: buildUrlscan,
            openUrl: q => `https://urlscan.io/search/#${encodeURIComponent(q)}`
        },
        fofa:{
            name:"fofa", accent:"#39ff6a",
            hint:'sintaxe FOFA: domain="alvo.com". requer login para ver tudo.',
            build: buildFofa,
            openUrl: q => { try { return `https://fofa.info/result?qbase64=${btoa(q)}`; } catch(e){ return "https://fofa.info/"; } }
        },
        virustotal:{
            name:"virustotal", accent:"#39ff6a",
            hint:"informe a API key do VT acima para preencher os comandos (opcional).",
            build: buildVirustotal,
            openUrl: q => q
        },
        yandex:{
            name:"yandex", accent:"#39ff6a",
            hint:"foco em recon de subdomínio/endpoint (rhost:/host:/url:) + vazamento, docs sensíveis e filtros avançados.",
            build: buildYandex,
            openUrl: q => `https://yandex.com/search/?text=${encodeURIComponent(q)}`
        }
    };

    let activeKey = "google";

    function render(){
        const source = SOURCES[activeKey];

        document.getElementById('wildcard-row').style.display = activeKey === 'google' ? 'flex' : 'none';
        document.getElementById('vtkey-row').style.display = activeKey === 'virustotal' ? 'flex' : 'none';
        document.getElementById('source-hint').textContent = source.hint;

        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.key === activeKey));

        const target = sanitizeTarget(document.getElementById('target').value);
        const body = document.getElementById('results-body');
        body.innerHTML = '';

        document.getElementById('results-title').innerHTML =
            `root@duck<span style="color:var(--fg-dim)">:~$</span> <b>${source.name}</b>${target ? ' --target ' + target : ''}`;

        if(!target){
            body.innerHTML = `<div class="empty-state"><p><span class="prompt">&gt;</span> nenhum alvo definido<span class="cursor">_</span></p><p>informe um domínio ou organização no campo "alvo" acima.</p></div>`;
            document.getElementById('stat-total').textContent = '0';
            document.getElementById('stat-cats').textContent = '0';
            return;
        }

        const wildcard = document.querySelector('input[name="domtype"]:checked').value === 'wildcard';
        const dp = wildcard ? `*.${target}` : target;
        const vtKey = document.getElementById('vtkey').value.trim() || 'YOUR_VT_API_KEY';
        const ctx = { t: target, dp, vtKey };

        const categories = source.build(ctx);
        let total = 0;

        categories.forEach(cat => {
            const catEl = document.createElement('div');
            catEl.className = 'dork-category';

            const h3 = document.createElement('h3');
            h3.textContent = cat.title;
            catEl.appendChild(h3);

            if(cat.notesHtml){
                const p = document.createElement('p');
                p.className = 'cat-notes';
                p.innerHTML = cat.notesHtml;
                catEl.appendChild(p);
            }

            if(cat.items){
                cat.items.forEach(item => {
                    const q = typeof item === 'string' ? item : item.q;
                    const ref = typeof item === 'string' ? null : item.ref;
                    catEl.appendChild(createDorkItem(q, ref, source.openUrl));
                    total++;
                });
            }

            if(cat.code){
                cat.code.forEach(codeText => catEl.appendChild(createCodeBlock(codeText)));
            }

            body.appendChild(catEl);
        });

        document.getElementById('stat-total').textContent = total;
        document.getElementById('stat-cats').textContent = categories.length;
    }

    function init(){
        const tabsEl = document.getElementById('tabs');
        Object.keys(SOURCES).forEach(key => {
            const s = SOURCES[key];
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'tab-btn' + (key === activeKey ? ' active' : '');
            b.dataset.key = key;
            b.textContent = s.name;
            b.addEventListener('click', () => { activeKey = key; render(); });
            tabsEl.appendChild(b);
        });

        document.getElementById('target').addEventListener('input', render);
        document.querySelectorAll('input[name="domtype"]').forEach(r => r.addEventListener('change', render));
        document.getElementById('vtkey').addEventListener('input', render);

        document.getElementById('copy-all-btn').addEventListener('click', () => {
            const body = document.getElementById('results-body');
            const parts = [];
            body.querySelectorAll('.dork-text').forEach(e => parts.push(e.textContent));
            body.querySelectorAll('.code-block').forEach(e => parts.push(e.textContent));
            if(!parts.length) return;
            navigator.clipboard.writeText(parts.join('\n')).catch(()=>{});
            const btn = document.getElementById('copy-all-btn');
            const orig = btn.textContent;
            btn.textContent = 'copiado!';
            setTimeout(() => btn.textContent = orig, 1500);
        });

        render();
    }

    if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

})();
</script>
</body>
</html>
